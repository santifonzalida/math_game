<form class="space-y-8" (submit)="start($event)">
  <div class="text-center">
    <h1 class="text-3xl font-bold tracking-tight sm:text-4xl">¿Qué tan rápido calculás?</h1>
    <p class="mt-2 text-slate-500 dark:text-slate-400">
      Respondé 10 preguntas correctas lo más rápido posible.
    </p>
  </div>

  <label class="block">
    <span class="text-sm font-medium text-slate-600 dark:text-slate-300">Tu nombre</span>
    <input
      class="mt-1 w-full rounded-xl border border-slate-300 bg-white px-4 py-3 text-lg outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/30 dark:border-slate-700 dark:bg-slate-900"
      maxlength="30"
      autocomplete="nickname"
      placeholder="Ej: Santi"
      [value]="name()"
      (input)="name.set($any($event.target).value)"
    />
  </label>

  <fieldset>
    <legend class="text-sm font-medium text-slate-600 dark:text-slate-300">Operación</legend>
    <div class="mt-2 grid grid-cols-2 gap-3 sm:grid-cols-4">
      @for (op of operations; track op.value) {
        <button
          type="button"
          class="flex flex-col items-center gap-1 rounded-xl border-2 px-3 py-4 transition"
          [class]="
            operation() === op.value
              ? 'border-indigo-500 bg-indigo-50 text-indigo-700 dark:bg-indigo-500/15 dark:text-indigo-300'
              : 'border-slate-200 bg-white hover:border-slate-300 dark:border-slate-800 dark:bg-slate-900 dark:hover:border-slate-700'
          "
          [attr.aria-pressed]="operation() === op.value"
          (click)="operation.set(op.value)"
        >
          <span class="text-3xl font-bold leading-none">{{ op.symbol }}</span>
          <span class="text-sm">{{ op.label }}</span>
        </button>
      }
    </div>
  </fieldset>

  <fieldset>
    <legend class="text-sm font-medium text-slate-600 dark:text-slate-300">Nivel</legend>
    <div class="mt-2 grid grid-cols-3 gap-3">
      @for (lvl of levels; track lvl.value) {
        <button
          type="button"
          class="rounded-xl border-2 px-3 py-3 transition"
          [class]="
            level() === lvl.value
              ? 'border-indigo-500 bg-indigo-50 text-indigo-700 dark:bg-indigo-500/15 dark:text-indigo-300'
              : 'border-slate-200 bg-white hover:border-slate-300 dark:border-slate-800 dark:bg-slate-900 dark:hover:border-slate-700'
          "
          [attr.aria-pressed]="level() === lvl.value"
          (click)="level.set(lvl.value)"
        >
          <span class="block font-semibold">{{ lvl.label }}</span>
          <span class="block text-xs text-slate-500 dark:text-slate-400">
            {{ hints[operation()][lvl.value] }}
          </span>
        </button>
      }
    </div>
  </fieldset>

  @if (error()) {
    <p
      class="rounded-lg bg-red-50 px-4 py-3 text-sm text-red-700 dark:bg-red-500/10 dark:text-red-300"
      role="alert"
    >
      No se pudo conectar con el servidor. ¿Está corriendo el backend?
    </p>
  }

  <div class="flex flex-col gap-3 sm:flex-row">
    <button
      type="submit"
      class="flex-1 rounded-xl bg-indigo-600 px-6 py-4 text-lg font-semibold text-white transition hover:bg-indigo-500 disabled:cursor-not-allowed disabled:opacity-50"
      [disabled]="!canStart()"
    >
      {{ loading() ? 'Cargando…' : 'Jugar' }}
    </button>
    <a
      class="rounded-xl border border-slate-300 px-6 py-4 text-center font-medium hover:bg-slate-100 dark:border-slate-700 dark:hover:bg-slate-800"
      routerLink="/ranking"
      [queryParams]="{ operation: operation(), level: level() }"
    >
      Ver ranking
    </a>
  </div>
</form>
